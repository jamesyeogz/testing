apiVersion: v1
kind: Service
metadata:
  name: supabase-postgres
  namespace: supabase
spec:
  selector:
    app: supabase-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: supabase-postgres
  namespace: supabase
spec:
  serviceName: supabase-postgres
  replicas: 1
  selector:
    matchLabels:
      app: supabase-postgres
  template:
    metadata:
      labels:
        app: supabase-postgres
    spec:
      initContainers:
        - name: prepare-initdb
          image: supabase/postgres:15.8.1.085
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -lc
            - |
              set -euo pipefail
              mkdir -p /work/initdb/init-scripts /work/initdb/migrations
              # Copy base init content from image into shared volume
              if [ -d /docker-entrypoint-initdb.d ]; then
                cp -a /docker-entrypoint-initdb.d/. /work/initdb/
              fi
              # Overlay our additional scripts (from ConfigMaps)
              if ls /cm/init-scripts/*.sql >/dev/null 2>&1; then
                cp -a /cm/init-scripts/. /work/initdb/init-scripts/
              fi
              if ls /cm/migrations/*.sql >/dev/null 2>&1; then
                cp -a /cm/migrations/. /work/initdb/migrations/
              fi
          volumeMounts:
            - name: initdb
              mountPath: /work/initdb
            - name: cm-init-scripts
              mountPath: /cm/init-scripts
            - name: cm-migrations
              mountPath: /cm/migrations
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: db
          image: supabase/postgres:15.8.1.085
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: supabase-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: supabase-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: supabase-secrets
                  key: POSTGRES_PORT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: supabase-secrets
                  key: JWT_SECRET
            - name: JWT_EXP
              value: "3600"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: etc-postgresql-custom
              mountPath: /etc/postgresql-custom
      volumes:
        - name: initdb
          emptyDir: {}
        - name: cm-init-scripts
          configMap:
            name: supabase-db-init-scripts
        - name: cm-migrations
          configMap:
            name: supabase-db-migrations
        - name: etc-postgresql-custom
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
