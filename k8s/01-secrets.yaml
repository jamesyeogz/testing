apiVersion: v1
kind: Secret
metadata:
  name: supabase-secrets
  namespace: supabase
stringData:
  # Fill these in securely before applying
  JWT_SECRET: "replace-with-strong-jwt-secret"
  ANON_KEY: "replace-with-generated-anon-jwt"
  SERVICE_ROLE_KEY: "replace-with-generated-service-role-jwt"
  GOTRUE_JWT_SECRET: "replace-with-strong-gotrue-jwt-secret"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "set-a-strong-password"
  # External Postgres connection
  POSTGRES_HOST: "10.0.0.10" # replace with your Postgres IP
  POSTGRES_DB: "postgres"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "example-password"
  POSTGRES_PORT: "5432"
  # Full connection URL for clients that need DSN (includes sslmode=disable by default)
  POSTGRES_URL: "postgresql://postgres:example-password@10.0.0.10:5432/postgres?sslmode=disable"
  # URLs
  SITE_URL: "https://your-domain.example.com"
  API_EXTERNAL_URL: "https://api.your-domain.example.com"
